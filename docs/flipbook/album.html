<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flipbook Album</title>


    <style>
        body {
            margin: 0;
            background: #2c2c2c;
            font-family: sans-serif;
            overflow: hidden;
        }

        #book-wrapper {
            width: 100vw;
            height: 100vh;
            background: #1a1a1a;
            position: relative;
            overflow: hidden;
            touch-action: none;
        }

        #zoom-layer {
            width: 2400px;
            height: 1600px;
            transform-origin: 0 0;
            position: absolute;
        }

        #book {
            width: 2400px;
            height: 1600px;
        }

        .page {
            background: white;
            overflow: hidden;
        }

        .page img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

        /* Pulsanti zoom e controlli */
        .controls-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 9999;
        }

        .zoom-btn {
            padding: 14px 18px;
            font-size: 20px;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .zoom-btn:hover {
            background: rgba(255, 255, 255, 0.8);
        }

        /* Frecce navigazione */
        .nav-btn {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            z-index: 9998;
            font-size: 40px;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.8);
        }

        #prev {
            left: 15px;
        }

        #next {
            right: 15px;
        }

        #zoom-indicator {
            position: fixed;
            top: 15px;
            right: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 12px;
            border-radius: 8px;
            z-index: 9999;
        }

        #mobile-start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            /* VERO DISPLAY DI DEFAULT */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            color: white;
            text-align: center;
        }

        #mobile-start-overlay button {
            margin-top: 20px;
            padding: 15px 30px;
            font-size: 20px;
            border-radius: 30px;
            border: none;
            background: #007bff;
            color: white;
            cursor: pointer;
        }

        #portrait-warning {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #1a1a1a;
            color: white;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10001;
            text-align: center;
            padding: 20px;
        }

        @media screen and (orientation: portrait) and (max-width: 1024px) {
            #portrait-warning {
                display: flex;
            }
        }

        /* Dimensioni PC/Desktop: Bottoni piccoli e trasparenti (Ripristinati) */
        @media screen and (min-width: 1025px) {
            .zoom-btn {
                padding: 4px 6px;
                font-size: 12px;
                background: rgba(255, 255, 255, 0.15);
            }

            .nav-btn {
                width: 24px;
                height: 24px;
                font-size: 14px;
                background: rgba(255, 255, 255, 0.15);
            }

            .zoom-btn:hover,
            .nav-btn:hover {
                background: rgba(255, 255, 255, 0.35);
            }
        }
    </style>
</head>

<body>

    <div id="book-wrapper">
        <div id="zoom-layer">
            <div id="book"></div>
        </div>
    </div>

    <div id="zoom-indicator">100%</div>

    <div class="controls-container">
        <button id="audio-toggle" class="zoom-btn" title="Mute/Unmute Musica">🔊</button>
        <button id="fullscreen-toggle" class="zoom-btn" title="Full Screen">⛶</button>
        <button id="zoom-reset" class="zoom-btn" title="Mostra 2 Pagine">🏚️</button>
    </div>

    <button id="prev" class="nav-btn">⟨</button>
    <button id="next" class="nav-btn">⟩</button>

    <div id="mobile-start-overlay">
        <h2>Album Giusto dire NO</h2>
        <p>Clicca per avviare l'album e la musica!</p>
        <button id="start-app">INIZIA</button>
    </div>

    <!-- Portrait Warning -->
    <div id="portrait-warning">
        <div class="warning-content">
            <span style="font-size: 50px;">🔄</span>
            <p>Per una visione ottimale, ruota il dispositivo in orizzontale</p>
        </div>
    </div>

    <audio id="flipSound" src="../flip.mp3"></audio>
    <audio id="openSound" src="../open.mp3"></audio>
    <audio id="closeSound" src="../close.mp3"></audio>
    <audio id="bgMusic" src="../GiustoDireNo.mp3" loop
        onerror="console.error('⚠️ ALARM FILE MANCANTE! Il file non è stato trovato dal server a questo indirizzo: ' + this.src); alert('Errore: impossibile caricare GiustoDireNo.mp3 on line. Controlla maiuscole/minuscole su GitHub!');"></audio>

    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>

    <script>
        // Risoluzione aumentata (doppia rispetto a prima per maggiore nitidezza)
        const BASE_WIDTH = 2400;
        const BASE_HEIGHT = 1600;

        let scale = 1;
        let maxScale = 8;

        let posX = 0;
        let posY = 0;

        let pageFlip;

        const zoomLayer = document.getElementById("zoom-layer");
        const wrapper = document.getElementById("book-wrapper");
        const zoomIndicator = document.getElementById("zoom-indicator");

        /* ==== AUTO FIT INIZIALE ==== */
        function calculateInitialScale() {
            const scaleX = wrapper.clientWidth / BASE_WIDTH;
            const scaleY = wrapper.clientHeight / BASE_HEIGHT;
            scale = Math.min(scaleX, scaleY);
            centerContent();
        }

        function centerContent() {
            const scaledWidth = BASE_WIDTH * scale;
            const scaledHeight = BASE_HEIGHT * scale;

            posX = (wrapper.clientWidth - scaledWidth) / 2;
            posY = (wrapper.clientHeight - scaledHeight) / 2;
        }

        function clampPosition() {
            const scaledWidth = BASE_WIDTH * scale;
            const scaledHeight = BASE_HEIGHT * scale;

            const minX = wrapper.clientWidth - scaledWidth;
            const minY = wrapper.clientHeight - scaledHeight;

            if (scaledWidth > wrapper.clientWidth) {
                posX = Math.min(0, Math.max(minX, posX));
            } else {
                posX = (wrapper.clientWidth - scaledWidth) / 2;
            }

            if (scaledHeight > wrapper.clientHeight) {
                posY = Math.min(0, Math.max(minY, posY));
            } else {
                posY = (wrapper.clientHeight - scaledHeight) / 2;
            }
        }

        function updateTransform() {
            clampPosition();
            zoomLayer.style.transform =
                `translate(${posX}px, ${posY}px) scale(${scale})`;
            zoomIndicator.innerText = Math.round(scale * 100) + "%";
        }

        /* ==== ZOOM CONTROLS E ROTTELLA (WHEEL) ==== */
        wrapper.addEventListener('wheel', (e) => {
            e.preventDefault();

            // Trova il punto esatto del mouse per zoomare verso di esso
            const rect = wrapper.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            const offsetX = (mouseX - posX) / scale;
            const offsetY = (mouseY - posY) / scale;

            // Determina la direzione dello zoom dalla rotellina del mouse
            const zoomAmount = e.deltaY > 0 ? -0.15 : 0.15;
            let newScale = Math.min(Math.max(scale + zoomAmount, 0.05), maxScale);

            scale = newScale;
            posX = mouseX - offsetX * scale;
            posY = mouseY - offsetY * scale;

            updateTransform();
        }, { passive: false });

        document.getElementById("zoom-reset").onclick = (e) => {
            e.stopPropagation();
            calculateInitialScale();
            updateTransform();
        };

        function toggleFullScreen() {
            const btn = document.getElementById("fullscreen-toggle");
            const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
            if (!fsEl) {
                const el = document.documentElement;
                const rfs = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
                if (rfs) {
                    try {
                        const promise = rfs.call(el);
                        if (promise && promise.then) {
                            promise.then(() => {
                                btn.innerText = "❌";
                                if (screen.orientation && screen.orientation.lock) {
                                    screen.orientation.lock('landscape').catch(() => {});
                                }
                            }).catch(err => console.warn("Fullscreen error:", err));
                        } else {
                            // Esecuzione sincrona (vecchi browser Webkit)
                            btn.innerText = "❌";
                            if (screen.orientation && screen.orientation.lock) {
                                screen.orientation.lock('landscape').catch(() => {});
                            }
                        }
                    } catch(e) {
                         console.warn("Fullscreen API non supportata", e);
                    }
                }
            } else {
                const efs = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
                if (efs) {
                    try {
                        const promise = efs.call(document);
                        if (promise && promise.then) {
                            promise.then(() => btn.innerText = "⛶").catch(() => {});
                        } else {
                            btn.innerText = "⛶";
                        }
                    } catch(e) {}
                }
            }
        }

        document.getElementById("fullscreen-toggle").onclick = (e) => {
            e.stopPropagation();
            toggleFullScreen();
        };




        /* ==== DOUBLE CLICK / TAP CON ZOOM CENTRATO ==== */
        let lastTap = 0;

        wrapper.addEventListener("pointerup", e => {
            if (dragOccurred) return;

            const now = Date.now();
            if (now - lastTap < 300) {

                const rect = wrapper.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const clickY = e.clientY - rect.top;

                const offsetX = (clickX - posX) / scale;
                const offsetY = (clickY - posY) / scale;

                if (scale < 2) scale = 2;
                else if (scale < 4) scale = 4;
                else if (scale < 6) scale = 6;
                else if (scale < 8) scale = 8;
                else {
                    calculateInitialScale();
                    updateTransform();
                    lastTap = now;
                    return;
                }

                posX = clickX - offsetX * scale;
                posY = clickY - offsetY * scale;

                updateTransform();
            }
            lastTap = now;
        });

        /* ==== DRAG ==== */
        let isDragging = false;
        let dragOccurred = false;
        let startX, startY;

        wrapper.addEventListener("pointerdown", e => {
            isDragging = true;
            dragOccurred = false;
            startX = e.clientX - posX;
            startY = e.clientY - posY;
        });

        wrapper.addEventListener("pointermove", e => {
            if (isDragging) {
                const newX = e.clientX - startX;
                const newY = e.clientY - startY;

                if (Math.abs(newX - posX) > 5 || Math.abs(newY - posY) > 5) {
                    dragOccurred = true;
                }

                posX = newX;
                posY = newY;
                updateTransform();
            }
        });

        wrapper.addEventListener("pointerup", () => {
            isDragging = false;
        });

        /* ==== PINCH TO ZOOM ==== */
        let initialPinchDistance = null;
        let initialScale = 1;
        let pinchCenter = { x: 0, y: 0 };

        wrapper.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                isDragging = false;
                dragOccurred = true; // prevent double tap zoom

                initialPinchDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                initialScale = scale;

                // Calculate center point of the pinch
                pinchCenter = {
                    x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
                    y: (e.touches[0].clientY + e.touches[1].clientY) / 2
                };
            }
        });

        wrapper.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {
                // e.preventDefault() here might be needed if passive: false is set, but pointer events handle most
                const currentDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );

                if (initialPinchDistance) {
                    const pinchScale = currentDistance / initialPinchDistance;
                    let newScale = Math.min(Math.max(initialScale * pinchScale, 0.05), maxScale);

                    // Zoom toward pinch center
                    const rect = wrapper.getBoundingClientRect();
                    const centerX = pinchCenter.x - rect.left;
                    const centerY = pinchCenter.y - rect.top;

                    // Calculate offset from current transform origin (posX, posY)
                    const offsetX = (centerX - posX) / scale;
                    const offsetY = (centerY - posY) / scale;

                    scale = newScale;
                    posX = centerX - offsetX * scale;
                    posY = centerY - offsetY * scale;

                    updateTransform();
                }
            }
        });

        wrapper.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) {
                initialPinchDistance = null;
            }
        });

        /* ==== AUDIO BACKGROUND E MOBILE/PC START ==== */
        const bgMusic = document.getElementById("bgMusic");
        const audioToggleBtn = document.getElementById("audio-toggle");
        const startOverlay = document.getElementById("mobile-start-overlay");
        let musicStarted = false;

        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

        function startMusic() {
            if (!musicStarted) {
                console.log("▶️ Tentativo di avvio audio...");
                bgMusic.play().then(() => {
                    console.log("✅ Audio avviato con successo!");
                    musicStarted = true;
                    audioToggleBtn.innerText = "🔊";
                }).catch(err => {
                    console.log("⚠️ Audio autoplay bloccato dal browser (richiede interazione utente).", err);
                });
            }
        }

        audioToggleBtn.onclick = (e) => {
            e.stopPropagation();
            if (!musicStarted) {
                startMusic();
                return;
            }
            if (bgMusic.paused) {
                bgMusic.play();
                audioToggleBtn.innerText = "🔊";
            } else {
                bgMusic.pause();
                audioToggleBtn.innerText = "🔇";
            }
        };

        // Click sul pulsantone gigante INIZIA!
        document.getElementById("start-app").onclick = () => {
            
            // Miglioria SUPER: tenta il fullscreen auto-magico subito se già in orizzontale
            if (typeof checkLandscapeFullscreen === "function") {
                checkLandscapeFullscreen();
            }

            if (isMobile) {
                // Tenta il fullscreen standard come fallback in modo sincrono
                const el = document.documentElement;
                const rfs = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
                
                if (rfs) {
                    rfs.call(el).then(() => {
                        if (screen.orientation && screen.orientation.lock) {
                            screen.orientation.lock('landscape').catch(() => {});
                        }
                    }).catch(err => console.warn("Fullscreen fallback:", err));
                }
            }

            // Azioni Sincrone cruciali per mantenere il "user gesture"
            startMusic();
            startOverlay.style.display = "none";
            
            // Timeout di sicurezza, ma la maggior parte del re-layout 
            // verrà gestita ora dal listener onFullscreenChange
            setTimeout(() => {
                calculateInitialScale();
                updateTransform();
            }, 600);
        };

        // Quando il fullscreen cambia (anche con ESC/gesto sistema), aggiorna zoom
        function onFullscreenChange() {
            const btn = document.getElementById("fullscreen-toggle");
            const isFs = document.fullscreenElement || document.webkitFullscreenElement;
            if (isFs) {
                btn.innerText = "❌";
                setTimeout(() => {
                    calculateInitialScale();
                    updateTransform();
                }, 300);
            } else {
                btn.innerText = "⛶";
                setTimeout(() => {
                    calculateInitialScale();
                    updateTransform();
                }, 300);
            }
        }
        document.addEventListener("fullscreenchange", onFullscreenChange);
        document.addEventListener("webkitfullscreenchange", onFullscreenChange);
        document.getElementById("next").onclick = () => pageFlip.flipNext();
        document.getElementById("prev").onclick = () => pageFlip.flipPrev();

        /* ==== LOAD BOOK ==== */
        const urlParams = new URLSearchParams(window.location.search);
        const format = urlParams.get('format') || '2x3';

        fetch(`../albums/${format}/pages.json`)
            .then(r => r.json())
            .then(pages => {

                const bookDiv = document.getElementById("book");

                pages.forEach(p => {
                    const div = document.createElement("div");
                    div.className = "page " + p.type;

                    const img = document.createElement("img");
                    img.src = `../albums/${format}/${p.image}`;

                    div.appendChild(img);
                    bookDiv.appendChild(div);
                });

                pageFlip = new St.PageFlip(bookDiv, {
                    width: 1200, // Dimensione aumentata per maggiore risoluzione (metà di BASE_WIDTH)
                    height: 1600, // Dimensione aumentata 
                    size: "fixed",
                    showCover: true,
                    mobileScrollSupport: false,
                    useMouseEvents: false
                });

                pageFlip.loadFromHTML(document.querySelectorAll('.page'));

                /* ==== SUONO FLIP, APERTURA E CHIUSURA ==== */
                const flipAudio = document.getElementById("flipSound");
                const openAudio = document.getElementById("openSound");
                const closeAudio = document.getElementById("closeSound");

                let currentPage = 0;

                pageFlip.on('flip', (e) => {
                    const targetPage = e.data;
                    const totalPages = pages.length;
                    let audioToPlay = flipAudio;

                    // Se eravamo alla pagina 0 (copertina chiusa frontale) e andiamo avanti -> Apriamo l'album
                    if (currentPage === 0 && targetPage > 0 && openAudio) {
                        audioToPlay = openAudio;
                    }
                    // Se eravamo all'ultima pagina (copertina chiusa posteriore) e torniamo indietro -> Apriamo l'album dal retro
                    else if (currentPage >= totalPages - 1 && targetPage < currentPage && openAudio) {
                        audioToPlay = openAudio;
                    }
                    // Se ritorniamo alla pagina 0 (chiusura frontale) o andiamo all'ultima (chiusura posteriore) -> Chiudiamo
                    else if ((targetPage === 0 || targetPage >= totalPages - 1) && closeAudio) {
                        audioToPlay = closeAudio;
                    }

                    currentPage = targetPage;

                    if (audioToPlay) {
                        audioToPlay.currentTime = 0;
                        audioToPlay.play().catch(err => console.log("Audio play blocked by browser:", err));
                    }
                });

                calculateInitialScale();
                updateTransform();
            });
        window.addEventListener("resize", () => {
            checkLandscapeFullscreen();
            
            // Non ricalcolare la scala automaticamente se l'utente ha zoomato manualimente
            // ma ricalcola se siamo alla scala iniziale (auto-fit)
            const oldInitialScale = Math.min(wrapper.clientWidth / BASE_WIDTH, wrapper.clientHeight / BASE_HEIGHT);
            if (Math.abs(scale - oldInitialScale) < 0.01) {
                calculateInitialScale();
            }
            updateTransform();
        });

        /* ==== AUTO FULLSCREEN QUANDO RUOTA IN LANDSCAPE ==== */
        function checkLandscapeFullscreen() {
            const isLandscape = window.matchMedia("(orientation: landscape)").matches;
            const isFs = document.fullscreenElement || document.webkitFullscreenElement;
            if (isLandscape && !isFs) {
                const el = document.documentElement;
                const rfs = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
                if (rfs) {
                    try {
                        const promise = rfs.call(el);
                        if (promise && promise.catch) {
                            promise.catch(() => {});
                        }
                    } catch (e) {}
                }
            }
        }

        window.addEventListener("orientationchange", () => {
            setTimeout(checkLandscapeFullscreen, 300);
        });
    </script>

</body>

</html>
