<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flipbook Album</title>


    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #2c2c2c;
            font-family: sans-serif;
        }

        #book-wrapper {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #1a1a1a;
            overflow: hidden;
            touch-action: none;
        }

        /* Dimensioni impostate via JS per corrispondere a BASE_WIDTH x BASE_HEIGHT */
        #zoom-layer {
            transform-origin: 0 0;
            position: absolute;
            top: 0;
            left: 0;
            will-change: transform;
        }

        #book {
            /* Dimensioni effettive impostate via JS (BASE_WIDTH x BASE_HEIGHT) */
            position: relative;
            /* Prospettiva 3D per trasformazioni fluide senza z-fighting */
            perspective: 2000px;
            -webkit-perspective: 2000px;
        }

        .page {
            background: #14284b;
            overflow: hidden;
            /* GPU layer singolo per pagina — il minimo indispensabile */
            will-change: transform;
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .page img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            /* NO will-change qui: il layer GPU è già sul .page genitore.
               Avere due layer sovrapposti causa flicker da compositing */
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }

        /* Pulsanti zoom e controlli */
        .controls-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 9999;
        }

        .zoom-btn {
            padding: 14px 18px;
            font-size: 20px;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .zoom-btn:hover {
            background: rgba(255, 255, 255, 0.8);
        }

        /* Frecce navigazione */
        .nav-btn {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            z-index: 9998;
            font-size: 40px;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.8);
        }

        #prev {
            left: 15px;
        }

        #next {
            right: 15px;
        }

        #zoom-indicator {
            position: fixed;
            top: 15px;
            right: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 12px;
            border-radius: 8px;
            z-index: 9999;
        }

        #mobile-start-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            color: white;
            text-align: center;
        }

        #mobile-start-overlay.hidden {
            display: none;
        }

        #mobile-start-overlay button {
            margin-top: 20px;
            padding: 15px 30px;
            font-size: 20px;
            border-radius: 30px;
            border: none;
            background: #007bff;
            color: white;
            cursor: pointer;
        }

        #portrait-warning {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a1a;
            color: white;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10001;
            text-align: center;
            padding: 20px;
            font-size: 18px;
        }

        #portrait-warning .warning-content {
            max-width: 90%;
        }

        #portrait-warning span {
            font-size: 80px;
        }

        #portrait-warning p {
            font-size: 7vw;
            line-height: 1.3;
            font-weight: bold;
        }


        @media screen and (orientation: portrait) and (max-width: 1024px) {
            #portrait-warning {
                display: flex;
            }
        }

        /* Dimensioni PC/Desktop: Bottoni piccoli e trasparenti (Ripristinati) */
        @media screen and (min-width: 1025px) {
            .zoom-btn {
                padding: 4px 6px;
                font-size: 12px;
                background: rgba(255, 255, 255, 0.15);
            }

            .nav-btn {
                width: 24px;
                height: 24px;
                font-size: 14px;
                background: rgba(255, 255, 255, 0.15);
            }

            .zoom-btn:hover,
            .nav-btn:hover {
                background: rgba(255, 255, 255, 0.35);
            }
        }
    </style>
</head>

<body>

    <div id="book-wrapper">
        <div id="zoom-layer">
            <div id="book"></div>
        </div>
    </div>

    <div id="zoom-indicator">100%</div>

    <div class="controls-container">
        <button id="audio-toggle" class="zoom-btn" title="Mute/Unmute Musica">🔊</button>
        <button id="fullscreen-toggle" class="zoom-btn" title="Full Screen">⛶</button>
        <button id="zoom-reset" class="zoom-btn" title="Mostra 2 Pagine">🏚️</button>
    </div>

    <button id="prev" class="nav-btn">⟨</button>
    <button id="next" class="nav-btn">⟩</button>

    <div id="mobile-start-overlay">
        <h2>Album Giusto dire NO</h2>
        <p>Clicca per avviare l'album!</p>
        <button id="start-app">INIZIA</button>
    </div>

    <!-- Portrait Warning -->
    <div id="portrait-warning">
        <div class="warning-content">
            <span style="font-size: 50px;">🔄</span>
            <p>Per una visione ottimale, ruota il dispositivo in orizzontale</p>
        </div>
    </div>


    <audio id="bgMusic" src="../GiustoDireNo.mp3" loop preload="auto" playsinline
        onerror="console.error('⚠️ ALARM FILE MANCANTE! Il file non è stato trovato dal server a questo indirizzo: ' + this.src); alert('Errore: impossibile caricare GiustoDireNo.mp3 on line. Controlla maiuscole/minuscole su GitHub!');"></audio>

    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>

    <script>
        // Risoluzione dinamica: leggera su mobile, alta su desktop
        const isMobileDevice = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        const BASE_WIDTH = isMobileDevice ? 1400 : 2480;
        const BASE_HEIGHT = isMobileDevice ? 990 : 1754;

        /**
         * Dimensioni REALI: legge direttamente dal wrapper che è
         * position:fixed;inset:0 → il browser DEVE renderlo a schermo intero.
         * wrapper.clientWidth/Height riflettono le dimensioni effettive renderizzate,
         * NON stime viewport come innerHeight / visualViewport / 100vh.
         */
        function getViewportSize() {
            return {
                width:  wrapper.clientWidth  || window.innerWidth,
                height: wrapper.clientHeight || window.innerHeight
            };
        }

        let scale = 1;
        let maxScale = 8;

        let posX = 0;
        let posY = 0;

        let pageFlip;
        let appStarted = false; // true dopo che l'utente preme INIZIA

        const zoomLayer = document.getElementById("zoom-layer");
        const wrapper = document.getElementById("book-wrapper");
        const zoomIndicator = document.getElementById("zoom-indicator");

        // Adatta zoom-layer E #book alla risoluzione effettiva
        zoomLayer.style.width = BASE_WIDTH + "px";
        zoomLayer.style.height = BASE_HEIGHT + "px";
        document.getElementById("book").style.width = BASE_WIDTH + "px";
        document.getElementById("book").style.height = BASE_HEIGHT + "px";



        /* ===== MODALITÀ IMMERSIVA MOBILE ===== */

        function enterFullscreen() {
            const el = document.documentElement;
            const rfs =
                el.requestFullscreen ||
                el.webkitRequestFullscreen ||
                el.msRequestFullscreen;

            if (rfs) {
                rfs.call(el).catch(() => { });
            }
        }

        /* quando ruoti il telefono aggiorna layout */
        window.addEventListener("orientationchange", () => {
            settleLayout();
        });

        /* ==== AUTO FIT INIZIALE ==== */
        function calculateInitialScale() {
            const vp = getViewportSize();
            // Protezione: se le dimensioni non sono ancora valide, non calcolare
            if (vp.width < 10 || vp.height < 10) return;
            const scaleX = vp.width / BASE_WIDTH;
            const scaleY = vp.height / BASE_HEIGHT;
            scale = Math.min(scaleX, scaleY);
            centerContent();
        }

        function centerContent() {
            const scaledWidth = BASE_WIDTH * scale;
            const scaledHeight = BASE_HEIGHT * scale;
            const vp = getViewportSize();

            posX = (vp.width - scaledWidth) / 2;
            posY = (vp.height - scaledHeight) / 2;
        }

        /**
         * Ricalcola layout in modo robusto:
         * - un calcolo immediato
         * - poi ritenta su 10 animation frame consecutivi
         * - più safety net a 500ms e 1000ms
         */
        function settleLayout() {
            // Calcolo immediato
            calculateInitialScale();
            updateTransform();

            // Ritenta su più frame (il browser potrebbe non
            // aver ancora aggiornato le dimensioni del wrapper)
            let count = 0;
            function step() {
                calculateInitialScale();
                updateTransform();
                if (++count < 10) requestAnimationFrame(step);
            }
            requestAnimationFrame(step);

            // Safety net per browser lenti
            setTimeout(() => { calculateInitialScale(); updateTransform(); }, 300);
            setTimeout(() => { calculateInitialScale(); updateTransform(); }, 800);
        }

        /* ==== RESIZE OBSERVER: auto-corregge SEMPRE ==== */
        if (typeof ResizeObserver !== 'undefined') {
            new ResizeObserver(() => {
                if (!appStarted) return; // non fare nulla prima di INIZIA
                calculateInitialScale();
                updateTransform();
            }).observe(wrapper);
        }

        function clampPosition() {
            const scaledWidth = BASE_WIDTH * scale;
            const scaledHeight = BASE_HEIGHT * scale;
            const vp = getViewportSize();

            const minX = vp.width - scaledWidth;
            const minY = vp.height - scaledHeight;

            if (scaledWidth > vp.width) {
                posX = Math.min(0, Math.max(minX, posX));
            } else {
                posX = (vp.width - scaledWidth) / 2;
            }

            if (scaledHeight > vp.height) {
                posY = Math.min(0, Math.max(minY, posY));
            } else {
                posY = (vp.height - scaledHeight) / 2;
            }
        }

        function updateTransform() {
            clampPosition();
            zoomLayer.style.transform =
                `translate3d(${posX}px, ${posY}px, 0) scale(${scale})`;
            zoomIndicator.innerText = Math.round(scale * 100) + "%";
        }

        /* ==== ZOOM CONTROLS E ROTTELLA (WHEEL) ==== */
        wrapper.addEventListener('wheel', (e) => {
            e.preventDefault();

            // Trova il punto esatto del mouse per zoomare verso di esso
            const rect = wrapper.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            const offsetX = (mouseX - posX) / scale;
            const offsetY = (mouseY - posY) / scale;

            // Determina la direzione dello zoom dalla rotellina del mouse
            const zoomAmount = e.deltaY > 0 ? -0.15 : 0.15;
            let newScale = Math.min(Math.max(scale + zoomAmount, 0.05), maxScale);

            scale = newScale;
            posX = mouseX - offsetX * scale;
            posY = mouseY - offsetY * scale;

            updateTransform();
        }, { passive: false });

        document.getElementById("zoom-reset").onclick = (e) => {
            e.stopPropagation();
            calculateInitialScale();
            scale = Math.max(scale, 0.01);
            updateTransform();
        };

        function toggleFullScreen() {
            const btn = document.getElementById("fullscreen-toggle");
            const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
            if (!fsEl) {
                const el = document.documentElement;
                const rfs = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
                if (rfs) {
                    try {
                        const promise = rfs.call(el);
                        if (promise && promise.then) {
                            promise.then(() => {
                                btn.innerText = "❌";
                                if (screen.orientation && screen.orientation.lock) {
                                    screen.orientation.lock('landscape').catch(() => { });
                                }
                            }).catch(err => console.warn("Fullscreen error:", err));
                        } else {
                            // Esecuzione sincrona (vecchi browser Webkit)
                            btn.innerText = "❌";
                            if (screen.orientation && screen.orientation.lock) {
                                screen.orientation.lock('landscape').catch(() => { });
                            }
                        }
                    } catch (e) {
                        console.warn("Fullscreen API non supportata", e);
                    }
                }
            } else {
                const efs = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
                if (efs) {
                    try {
                        const promise = efs.call(document);
                        if (promise && promise.then) {
                            promise.then(() => btn.innerText = "⛶").catch(() => { });
                        } else {
                            btn.innerText = "⛶";
                        }
                    } catch (e) { }
                }
            }
        }

        document.getElementById("fullscreen-toggle").onclick = (e) => {
            e.stopPropagation();
            toggleFullScreen();
        };




        /* ==== DOUBLE CLICK / TAP CON ZOOM CENTRATO ==== */
        let lastTap = 0;

        wrapper.addEventListener("pointerup", e => {
            if (dragOccurred) {
                dragOccurred = false;
                return;
            }

            const now = Date.now();
            if (now - lastTap < 300) {

                const rect = wrapper.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const clickY = e.clientY - rect.top;

                const offsetX = (clickX - posX) / scale;
                const offsetY = (clickY - posY) / scale;

                if (scale < 2) scale = 2;
                else if (scale < 4) scale = 4;
                else if (scale < 6) scale = 6;
                else if (scale < 8) scale = 8;
                else {
                    calculateInitialScale();
                    updateTransform();
                    lastTap = now;
                    return;
                }

                posX = clickX - offsetX * scale;
                posY = clickY - offsetY * scale;

                updateTransform();
            }
            lastTap = now;
        });

        /* ==== DRAG ==== */
        let isDragging = false;
        let dragOccurred = false;
        let startX, startY;

        wrapper.addEventListener("pointerdown", e => {
            isDragging = true;
            dragOccurred = false;
            startX = e.clientX - posX;
            startY = e.clientY - posY;
        });

        wrapper.addEventListener("pointermove", e => {
            if (!isDragging) return;
            const newX = e.clientX - startX;
            const newY = e.clientY - startY;

            if (Math.abs(newX - posX) > 5 || Math.abs(newY - posY) > 5) {
                dragOccurred = true;
            }

            posX = newX;
            posY = newY;
            updateTransform();
        });

        wrapper.addEventListener("pointerup", () => {
            isDragging = false;
        });

        /* ==== PINCH TO ZOOM ==== */
        let initialPinchDistance = null;
        let initialScale = 1;
        let pinchCenter = { x: 0, y: 0 };

        wrapper.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                isDragging = false;
                dragOccurred = true; // prevent double tap zoom

                initialPinchDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                initialScale = scale;

                // Calculate center point of the pinch
                pinchCenter = {
                    x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
                    y: (e.touches[0].clientY + e.touches[1].clientY) / 2
                };
            }
        });

        wrapper.addEventListener('touchmove', (e) => {
            if (e.cancelable) e.preventDefault();

            if (e.touches.length === 2) {
                // e.preventDefault() here might be needed if passive: false is set, but pointer events handle most
                const currentDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );

                if (initialPinchDistance) {
                    const pinchScale = currentDistance / initialPinchDistance;
                    let newScale = Math.min(Math.max(initialScale * pinchScale, 0.05), maxScale);

                    // Zoom toward pinch center
                    const rect = wrapper.getBoundingClientRect();
                    const centerX = pinchCenter.x - rect.left;
                    const centerY = pinchCenter.y - rect.top;

                    // Calculate offset from current transform origin (posX, posY)
                    const offsetX = (centerX - posX) / scale;
                    const offsetY = (centerY - posY) / scale;

                    scale = newScale;
                    posX = centerX - offsetX * scale;
                    posY = centerY - offsetY * scale;

                    updateTransform();
                }
            }
        });

        wrapper.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) {
                initialPinchDistance = null;
            }
        });

        /* ==== AUDIO BACKGROUND E MOBILE/PC START ==== */
        const bgMusic = document.getElementById("bgMusic");
        const audioToggleBtn = document.getElementById("audio-toggle");
        const startOverlay = document.getElementById("mobile-start-overlay");
        let musicStarted = false;

        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

        /* ==== SUONI (WEB AUDIO API) — scope globale ==== */
        let audioCtx;
        let flipBuffer, openBuffer, closeBuffer;

        function ensureAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                Promise.all([
                    loadSound("../flip.mp3"),
                    loadSound("../open.mp3"),
                    loadSound("../close.mp3")
                ]).then(buffers => {
                    flipBuffer = buffers[0];
                    openBuffer = buffers[1];
                    closeBuffer = buffers[2];
                });
            }
        }

        async function loadSound(url) {
            try {
                const res = await fetch(url);
                const arrayBuffer = await res.arrayBuffer();
                return await audioCtx.decodeAudioData(arrayBuffer);
            } catch (e) {
                console.error("Audio load failed:", e);
                return null;
            }
        }

        let lastSoundTime = 0;

        function playSound(buffer, offset = 0) {
            const now = Date.now();
            if (now - lastSoundTime < 150) return;
            lastSoundTime = now;

            if (!buffer || !audioCtx) return;
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const source = audioCtx.createBufferSource();
            source.buffer = buffer;
            source.connect(audioCtx.destination);
            source.start(0, offset);
        }

        function startMusic() {
            if (!musicStarted) {
                console.log("▶️ Tentativo di avvio audio...");
                bgMusic.play().then(() => {
                    console.log("✅ Audio avviato con successo!");
                    musicStarted = true;
                    audioToggleBtn.innerText = "🔊";
                }).catch(err => {
                    console.log("⚠️ Audio autoplay bloccato dal browser (richiede interazione utente).", err);
                });
            }
        }

        audioToggleBtn.onclick = (e) => {
            e.stopPropagation();
            if (!musicStarted) {
                startMusic();
                return;
            }
            if (bgMusic.paused) {
                bgMusic.play();
                audioToggleBtn.innerText = "🔊";
            } else {
                bgMusic.pause();
                audioToggleBtn.innerText = "🔇";
            }
        };

        // Click sul pulsantone gigante INIZIA!
        document.getElementById("start-app").onclick = () => {

            // Azioni sincrone (mantengono il "user gesture" per audio + fullscreen)
            startMusic();
            ensureAudioContext();

            // Nascondi overlay via classe CSS
            startOverlay.classList.add('hidden');

            // Segna che l'app è partita (abilita ResizeObserver)
            appStarted = true;

            // Fullscreen (best-effort)
            enterFullscreen();

            // Ricalcola layout robusto
            settleLayout();
        };

        // Quando il fullscreen cambia (anche con ESC/gesto sistema), aggiorna zoom
        function onFullscreenChange() {
            const btn = document.getElementById("fullscreen-toggle");
            const isFs = document.fullscreenElement || document.webkitFullscreenElement;
            btn.innerText = isFs ? "❌" : "⛶";
            settleLayout();
        }
        document.addEventListener("fullscreenchange", onFullscreenChange);
        document.addEventListener("webkitfullscreenchange", onFullscreenChange);

        /* ==== LOAD BOOK ==== */
        const urlParams = new URLSearchParams(window.location.search);
        const format = urlParams.get('format') || '2x3';

        fetch(`../albums/${format}/pages.json`)
            .then(r => r.json())
            .then(pages => {

                /* ==== CARICAMENTO PROGRESSIVO IMMAGINI ==== */
                const bookDiv = document.getElementById("book");

                // Prime 10 pagine caricate subito (copertina + 4 spread)
                const EAGER_COUNT = 10;

                // Placeholder trasparente 1x1px per evitare che il background
                // della pagina lampeggi quando l'immagine non ha ancora src
                const BLANK_GIF = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';

                pages.forEach((p, index) => {
                    const div = document.createElement("div");
                    div.className = "page " + p.type;

                    const img = document.createElement("img");

                    if (index < EAGER_COUNT) {
                        img.src = `../albums/${format}/${p.image}`;
                        img.loading = "eager";
                        img.decoding = "sync"; // prime pagine: decode sincrono per evitare flash
                    } else {
                        // Placeholder trasparente: niente flash del background blu
                        img.src = BLANK_GIF;
                        img.dataset.src = `../albums/${format}/${p.image}`;
                        img.loading = "lazy";
                        img.decoding = "async";
                    }

                    div.appendChild(img);
                    bookDiv.appendChild(div);
                });

                pageFlip = new St.PageFlip(bookDiv, {
                    width: Math.round(BASE_WIDTH / 2),
                    height: BASE_HEIGHT,
                    size: "fixed",
                    showCover: true,
                    mobileScrollSupport: false,
                    useMouseEvents: false,
                    // Sfoglio lento e realistico: 1200ms dà tempo al preload
                    flippingTime: 1200,
                    // === ANTI-FLICKER ===
                    // Disabilita le ombre dinamiche: la libreria le ridisegna
                    // ad OGNI frame dell'animazione causando repaint continui
                    // che l'occhio percepisce come intermittenza/sfarfallio
                    drawShadow: false,
                    maxShadowOpacity: 0,
                    // Z-index stabile: evita che il browser ricomponga i layer
                    // durante lo sfoglio (causa di flash impercettibili)
                    startZIndex: 10
                });

                pageFlip.loadFromHTML(document.querySelectorAll('.page'));
                
                pageFlip.on('init', () => {
                    loadNearbyPages(0);
                });

                /* ==== LAZY LOAD SPREAD-AWARE (OTTIMIZZATO) ==== */
                let lastDirection = 1; // 1 = avanti, -1 = indietro

                // Cache globale per immagini pre-decodificate
                const decodedCache = new Map();

                /**
                 * Pre-carica E pre-decodifica un'immagine in memoria.
                 * Restituisce una Promise che si risolve quando l'immagine
                 * è completamente pronta per il rendering (zero flash).
                 */
                function preloadAndDecode(src) {
                    if (decodedCache.has(src)) return decodedCache.get(src);

                    const promise = new Promise((resolve) => {
                        const tmp = new Image();
                        tmp.src = src;
                        if (tmp.decode) {
                            tmp.decode().then(() => resolve(tmp)).catch(() => resolve(tmp));
                        } else {
                            tmp.onload = () => resolve(tmp);
                            tmp.onerror = () => resolve(tmp);
                        }
                    });
                    decodedCache.set(src, promise);
                    return promise;
                }

                /**
                 * Attiva un'immagine nella pagina: se è già decodificata
                 * in cache la swap è SINCRONA (zero flash), altrimenti
                 * attende decode e poi swappa.
                 */
                function activateImage(img) {
                    if (!img.dataset.src) return;
                    const src = img.dataset.src;

                    // Segna subito come "in caricamento" per evitare doppie chiamate
                    const pendingSrc = img.dataset.src;
                    delete img.dataset.src;

                    // Controlla se abbiamo già l'immagine decodificata in cache
                    const cached = decodedCache.get(src);
                    if (cached && typeof cached.then === 'function') {
                        // Se la promise è già risolta, il .then è quasi sincrono
                        cached.then((decodedImg) => {
                            // Swap atomico: src viene assegnato solo DOPO decode
                            img.decoding = "sync";
                            img.src = src;
                        }).catch(() => {
                            img.src = src; // fallback
                        });
                    } else {
                        // Non ancora in cache: avvia preload+decode, poi swappa
                        preloadAndDecode(src).then(() => {
                            img.decoding = "sync";
                            img.src = src;
                        }).catch(() => {
                            img.src = src;
                        });
                    }
                }

                function loadNearbyPages(current) {
                    const imgs = document.querySelectorAll(".page img");
                    const total = imgs.length;

                    // Buffer generoso: con 1200ms di animazione c'è tempo
                    // per precaricare più pagine in anticipo
                    const SPREAD_PRELOAD = isMobileDevice ? 4 : 6;

                    // Boost direzionale: carica più avanti nella direzione di sfoglio
                    const boost = isMobileDevice ? 4 : 6;
                    const forwardBoost = lastDirection === 1 ? boost : 0;
                    const backwardBoost = lastDirection === -1 ? boost : 0;

                    const start = Math.max(0, current - (SPREAD_PRELOAD * 2) - backwardBoost);
                    const end = Math.min(total - 1, current + (SPREAD_PRELOAD * 2) + forwardBoost);

                    // Fascia prioritaria: attiva subito (src + decode)
                    for (let i = start; i <= end; i++) {
                        activateImage(imgs[i]);
                    }

                    // Fascia secondaria: pre-decode in background (senza attivare src)
                    const extraBefore = Math.max(0, start - 4);
                    const extraAfter = Math.min(total - 1, end + 4);
                    for (let i = extraBefore; i < start; i++) {
                        if (imgs[i].dataset.src) preloadAndDecode(`../albums/${format}/${pages[i].image}`);
                    }
                    for (let i = end + 1; i <= extraAfter; i++) {
                        if (imgs[i].dataset.src) preloadAndDecode(`../albums/${format}/${pages[i].image}`);
                    }
                }

                /* ==== IDLE BACKGROUND PRELOADER ==== */
                // Carica progressivamente TUTTE le pagine rimanenti durante i tempi morti
                let idlePreloadIndex = EAGER_COUNT; // parti da dove finisce l'eager load

                function idlePreloadStep(deadline) {
                    const imgs = document.querySelectorAll(".page img");
                    while (idlePreloadIndex < imgs.length) {
                        // Se rimane poco tempo nel frame idle, cedi al browser
                        if (deadline && deadline.timeRemaining() < 5) break;

                        const img = imgs[idlePreloadIndex];
                        if (img.dataset.src) {
                            // Pre-decode in background (non attiva src per non forzare repaint)
                            preloadAndDecode(img.dataset.src);
                        }
                        idlePreloadIndex++;
                    }

                    // Continua nel prossimo idle se ci sono ancora pagine
                    if (idlePreloadIndex < imgs.length) {
                        if (window.requestIdleCallback) {
                            requestIdleCallback(idlePreloadStep, { timeout: 3000 });
                        } else {
                            setTimeout(() => idlePreloadStep(null), 200);
                        }
                    }
                }

                // Avvia il preloader idle dopo un breve ritardo per non competere col rendering iniziale
                setTimeout(() => {
                    if (window.requestIdleCallback) {
                        requestIdleCallback(idlePreloadStep, { timeout: 3000 });
                    } else {
                        idlePreloadStep(null);
                    }
                }, 2000);

                /* ==== AUDIO: offset e bottoni ==== */

                // Offset ideali per compensare i silenzi inziali dei file mp3 tagliare una frazione prima dell'inizio effettivo
                const AUDIO_START = {
                    flip: 0.03,
                    open: 0.15,
                    close: 0.85
                };

                document.getElementById("next").onclick = (e) => {
                    playSound(flipBuffer, AUDIO_START.flip);
                    pageFlip.flipNext();
                };
                document.getElementById("prev").onclick = (e) => {
                    playSound(flipBuffer, AUDIO_START.flip);
                    pageFlip.flipPrev();
                };

                let currentPage = 0;

                /**
                 * Precarica aggressivamente PRIMA che l'animazione di flip inizi.
                 * Con 1200ms di animazione c'è abbastanza tempo per decodificare
                 * le immagini delle pagine successive durante lo sfoglio.
                 */
                pageFlip.on('changeOrientation', () => {
                    // Pre-carica basandosi sulla pagina corrente + direzione
                    const nextTarget = currentPage + (lastDirection === 1 ? 2 : -2);
                    if (nextTarget >= 0 && nextTarget < pages.length) {
                        loadNearbyPages(nextTarget);
                    }
                });

                pageFlip.on('flip', (e) => {
                    const targetPage = e.data;

                    // Traccia direzione per boost preload
                    lastDirection = targetPage > currentPage ? 1 : -1;

                    // PRELOAD IMMEDIATO (durante l'animazione di 1200ms)
                    loadNearbyPages(targetPage);

                    // Precarichiamo anche un po' più avanti nella direzione di sfoglio
                    // sfruttando i 1200ms di animazione
                    const lookAhead = targetPage + (lastDirection * 4);
                    if (lookAhead >= 0 && lookAhead < pages.length) {
                        loadNearbyPages(lookAhead);
                    }

                    requestAnimationFrame(() => {
                        const totalPages = pages.length;
                        let bufferToPlay = null;
                        let offsetToPlay = 0;

                        // Se eravamo alla pagina 0 (copertina chiusa frontale) e andiamo avanti -> Apriamo l'album
                        if (currentPage === 0 && targetPage > 0 && openBuffer) {
                            bufferToPlay = openBuffer;
                            offsetToPlay = AUDIO_START.open;
                        }
                        // Se eravamo all'ultima pagina (copertina chiusa posteriore) e torniamo indietro -> Apriamo l'album dal retro
                        else if (currentPage >= totalPages - 1 && targetPage < currentPage && openBuffer) {
                            bufferToPlay = openBuffer;
                            offsetToPlay = AUDIO_START.open;
                        }
                        // Se ritorniamo alla pagina 0 (chiusura frontale) o andiamo all'ultima (chiusura posteriore) -> Chiudiamo
                        else if ((targetPage === 0 || targetPage >= totalPages - 1) && closeBuffer) {
                            bufferToPlay = closeBuffer;
                            offsetToPlay = AUDIO_START.close;
                        }
                        // SFOGLIO NORMALE: l'audio flip è gestito direttamente nei bottoni prev/next

                        currentPage = targetPage;

                        if (bufferToPlay) {
                            playSound(bufferToPlay, offsetToPlay);
                        }
                    });
                });

                calculateInitialScale();
                updateTransform();
            });
        window.addEventListener("resize", () => {
            if (!appStarted) return;
            settleLayout();
        });

        // iOS Safari edge case: non triggera sempre 'resize' ma triggera visualViewport
        window.visualViewport?.addEventListener('resize', () => {
            if (!appStarted) return;
            settleLayout();
        });
    </script>
