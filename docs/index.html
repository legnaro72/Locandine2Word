<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flipbook Album</title>

<style>
body {
    margin: 0;
    background: #2c2c2c;
    font-family: sans-serif;
    overflow: hidden;
}

/* WRAPPER */
#book-wrapper {
    width: 100vw;
    height: 100vh;
    background: #1a1a1a;
    position: relative;
    overflow: hidden;
}

/* VIEWPORT (PC scroll) */
#book-viewport {
    width: 100%;
    height: 100%;
    overflow: auto;
    position: relative;
}

/* Scrollbar desktop */
#book-viewport::-webkit-scrollbar {
    width: 18px;
    height: 18px;
}
#book-viewport::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.6);
    border-radius: 10px;
}
#book-viewport {
    scrollbar-width: auto;
}

/* ZOOM LAYER */
#zoom-layer {
    width: 1200px;
    height: 800px;
    transform-origin: 0 0;
    position: absolute;
    top: 0;
    left: 0;
}

/* BOOK */
#book {
    width: 1200px;
    height: 800px;
}

/* PAGE */
.page {
    background: white;
    overflow: hidden;
}
.page img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
}

/* BUTTONS */
.zoom-btn {
    position: fixed;
    bottom: 20px;
    z-index: 9999;
    padding: 14px 18px;
    font-size: 20px;
    background: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}
#zoom-in { right: 90px; }
#zoom-out { right: 20px; }

#zoom-indicator {
    position: fixed;
    top: 15px;
    right: 20px;
    color: white;
    background: rgba(0,0,0,0.6);
    padding: 6px 12px;
    border-radius: 8px;
}
</style>
</head>

<body>

<div id="book-wrapper">
    <div id="book-viewport">
        <div id="zoom-layer">
            <div id="book"></div>
        </div>
    </div>
</div>

<div id="zoom-indicator">100%</div>
<button id="zoom-in" class="zoom-btn">➕</button>
<button id="zoom-out" class="zoom-btn">➖</button>

<audio id="flipSound" src="flip.mp3"></audio>

<script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>

<script>
const BASE_WIDTH = 1200;
const BASE_HEIGHT = 800;

let scale = 1;
let minScale = 0.2;
let maxScale = 4;

let posX = 0;
let posY = 0;

const zoomLayer = document.getElementById("zoom-layer");
const viewport = document.getElementById("book-viewport");
const wrapper = document.getElementById("book-wrapper");
const zoomIndicator = document.getElementById("zoom-indicator");

function updateTransform() {
    zoomLayer.style.transform =
        `translate(${posX}px, ${posY}px) scale(${scale})`;
    zoomIndicator.innerText = Math.round(scale * 100) + "%";
}

/* ==== DESKTOP ==== */

/* Zoom con pulsanti */
document.getElementById("zoom-in").onclick = () => {
    scale = Math.min(scale + 0.2, maxScale);
    updateTransform();
};
document.getElementById("zoom-out").onclick = () => {
    scale = Math.max(scale - 0.2, minScale);
    updateTransform();
};

/* Rotellina mouse */
viewport.addEventListener("wheel", e => {
    if (e.ctrlKey) return;
    e.preventDefault();
    const delta = e.deltaY < 0 ? 0.2 : -0.2;
    scale = Math.min(Math.max(scale + delta, minScale), maxScale);
    updateTransform();
}, { passive:false });

/* ==== MOBILE ==== */

let isDragging = false;
let startX, startY;

/* Drag */
wrapper.addEventListener("touchstart", e => {
    if (e.touches.length === 1) {
        isDragging = true;
        startX = e.touches[0].clientX - posX;
        startY = e.touches[0].clientY - posY;
    }
});

wrapper.addEventListener("touchmove", e => {
    if (isDragging && e.touches.length === 1) {
        posX = e.touches[0].clientX - startX;
        posY = e.touches[0].clientY - startY;
        updateTransform();
    }
}, { passive:false });

wrapper.addEventListener("touchend", () => {
    isDragging = false;
});

/* Pinch */
let initialDistance = null;

wrapper.addEventListener("touchstart", e => {
    if (e.touches.length === 2) {
        initialDistance = getDistance(e.touches);
    }
});

wrapper.addEventListener("touchmove", e => {
    if (e.touches.length === 2 && initialDistance) {
        let newDistance = getDistance(e.touches);
        let delta = (newDistance - initialDistance) / 200;
        scale = Math.min(Math.max(scale + delta, minScale), maxScale);
        updateTransform();
        initialDistance = newDistance;
    }
}, { passive:false });

function getDistance(t) {
    const dx = t[0].clientX - t[1].clientX;
    const dy = t[0].clientY - t[1].clientY;
    return Math.sqrt(dx*dx + dy*dy);
}

/* Doppio tap centrato */
let lastTap = 0;

wrapper.addEventListener("touchend", e => {
    const now = Date.now();
    if (now - lastTap < 300) {

        const rect = wrapper.getBoundingClientRect();
        const tapX = e.changedTouches[0].clientX - rect.left;
        const tapY = e.changedTouches[0].clientY - rect.top;

        const newScale = scale < 1.5 ? 2 : 1;

        const offsetX = (tapX - posX) / scale;
        const offsetY = (tapY - posY) / scale;

        scale = newScale;

        posX = tapX - offsetX * scale;
        posY = tapY - offsetY * scale;

        updateTransform();
    }
    lastTap = now;
});

/* ==== PAGE FLIP ==== */

fetch('pages.json')
.then(r => r.json())
.then(pages => {

    const bookDiv = document.getElementById("book");

    pages.forEach(p => {
        const div = document.createElement("div");
        div.className = "page " + p.type;

        const img = document.createElement("img");
        img.src = p.image;

        div.appendChild(img);
        bookDiv.appendChild(div);
    });

    const pageFlip = new St.PageFlip(bookDiv, {
        width: 600,
        height: 800,
        size: "fixed",
        showCover: true,
        mobileScrollSupport: false
    });

    pageFlip.loadFromHTML(document.querySelectorAll('.page'));

});
</script>

</body>
</html>
