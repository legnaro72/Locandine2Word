<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flipbook Album</title>

    
<style>
body {
    margin: 0;
    background: #2c2c2c;
    font-family: sans-serif;
    overflow: hidden;
}

#book-wrapper {
    width: 100vw;
    height: 100vh;
    background: #1a1a1a;
    position: relative;
    overflow: hidden;
    touch-action: none;
}

#zoom-layer {
    width: 1200px;
    height: 800px;
    transform-origin: 0 0;
    position: absolute;
}

#book {
    width: 1200px;
    height: 800px;
}

.page {
    background: white;
    overflow: hidden;
}

.page img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
}

/* Pulsanti zoom */
.zoom-btn {
    position: fixed;
    bottom: 20px;
    z-index: 9999;
    padding: 14px 18px;
    font-size: 20px;
    background: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}
#zoom-in { right: 90px; }
#zoom-out { right: 20px; }

/* Frecce navigazione */
.nav-btn {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    z-index: 9999;
    font-size: 40px;
    background: rgba(255,255,255,0.9);
    border: none;
    border-radius: 50%;
    width: 60px;
    height: 60px;
    cursor: pointer;
}
#prev { left: 15px; }
#next { right: 15px; }

#zoom-indicator {
    position: fixed;
    top: 15px;
    right: 20px;
    color: white;
    background: rgba(0,0,0,0.6);
    padding: 6px 12px;
    border-radius: 8px;
}
</style>
</head>

<body>

<div id="book-wrapper">
    <div id="zoom-layer">
        <div id="book"></div>
    </div>
</div>

<div id="zoom-indicator">100%</div>

<button id="zoom-in" class="zoom-btn">➕</button>
<button id="zoom-out" class="zoom-btn">➖</button>

<button id="prev" class="nav-btn">⟨</button>
<button id="next" class="nav-btn">⟩</button>

<audio id="flipSound" src="flip.mp3"></audio>

<script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>

<script>
const BASE_WIDTH = 1200;
const BASE_HEIGHT = 800;

let scale = 1;
let maxScale = 8;

let posX = 0;
let posY = 0;

let pageFlip;

const zoomLayer = document.getElementById("zoom-layer");
const wrapper = document.getElementById("book-wrapper");
const zoomIndicator = document.getElementById("zoom-indicator");

/* ==== AUTO FIT INIZIALE ==== */
function calculateInitialScale() {
    const scaleX = wrapper.clientWidth / BASE_WIDTH;
    const scaleY = wrapper.clientHeight / BASE_HEIGHT;
    scale = Math.min(scaleX, scaleY);
    centerContent();
}

function centerContent() {
    const scaledWidth = BASE_WIDTH * scale;
    const scaledHeight = BASE_HEIGHT * scale;

    posX = (wrapper.clientWidth - scaledWidth) / 2;
    posY = (wrapper.clientHeight - scaledHeight) / 2;
}

function clampPosition() {
    const scaledWidth = BASE_WIDTH * scale;
    const scaledHeight = BASE_HEIGHT * scale;

    const minX = wrapper.clientWidth - scaledWidth;
    const minY = wrapper.clientHeight - scaledHeight;

    if (scaledWidth > wrapper.clientWidth) {
        posX = Math.min(0, Math.max(minX, posX));
    } else {
        posX = (wrapper.clientWidth - scaledWidth) / 2;
    }

    if (scaledHeight > wrapper.clientHeight) {
        posY = Math.min(0, Math.max(minY, posY));
    } else {
        posY = (wrapper.clientHeight - scaledHeight) / 2;
    }
}

function updateTransform() {
    clampPosition();
    zoomLayer.style.transform =
        `translate(${posX}px, ${posY}px) scale(${scale})`;
    zoomIndicator.innerText = Math.round(scale * 100) + "%";
}

/* ==== ZOOM BUTTONS ==== */
document.getElementById("zoom-in").onclick = () => {
    scale += 0.2;
    updateTransform();
};
document.getElementById("zoom-out").onclick = () => {
    scale = Math.max(scale - 0.2, 0.05);
    updateTransform();
};

/* ==== DOUBLE CLICK / TAP CON ZOOM CENTRATO ==== */
let lastTap = 0;

wrapper.addEventListener("pointerup", e => {
    const now = Date.now();
    if (now - lastTap < 300) {

        const rect = wrapper.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const clickY = e.clientY - rect.top;

        const offsetX = (clickX - posX) / scale;
        const offsetY = (clickY - posY) / scale;

        if (scale < 2) scale = 2;
        else if (scale < 4) scale = 4;
        else if (scale < 6) scale = 6;
        else if (scale < 8) scale = 8;
        else {
            calculateInitialScale();
            updateTransform();
            lastTap = now;
            return;
        }

        posX = clickX - offsetX * scale;
        posY = clickY - offsetY * scale;

        updateTransform();
    }
    lastTap = now;
});

/* ==== DRAG ==== */
let isDragging = false;
let startX, startY;

wrapper.addEventListener("pointerdown", e => {
    isDragging = true;
    startX = e.clientX - posX;
    startY = e.clientY - posY;
});

wrapper.addEventListener("pointermove", e => {
    if (isDragging) {
        posX = e.clientX - startX;
        posY = e.clientY - startY;
        updateTransform();
    }
});

wrapper.addEventListener("pointerup", () => {
    isDragging = false;
});

/* ==== FRECCE ==== */
document.getElementById("next").onclick = () => pageFlip.flipNext();
document.getElementById("prev").onclick = () => pageFlip.flipPrev();

/* ==== LOAD BOOK ==== */
fetch('pages.json')
.then(r => r.json())
.then(pages => {

    const bookDiv = document.getElementById("book");

    pages.forEach(p => {
        const div = document.createElement("div");
        div.className = "page " + p.type;

        const img = document.createElement("img");
        img.src = p.image;

        div.appendChild(img);
        bookDiv.appendChild(div);
    });

    pageFlip = new St.PageFlip(bookDiv, {
        width: 600,
        height: 800,
        size: "fixed",
        showCover: true,
        mobileScrollSupport: false,
        useMouseEvents: false
    });

    pageFlip.loadFromHTML(document.querySelectorAll('.page'));

    calculateInitialScale();
    updateTransform();
});

window.addEventListener("resize", () => {
    calculateInitialScale();
    updateTransform();
});
</script>

</body>
</html>
