<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">

<meta name="viewport" 
      content="width=device-width, 
               initial-scale=1.0, 
               maximum-scale=1.0, 
               user-scalable=no, 
               viewport-fit=cover">

<title>Flipbook Album</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100dvh;
    background: #2c2c2c;
    font-family: sans-serif;
    overflow: hidden;
}

#rotate-warning {
    display: none;
    position: fixed;
    inset: 0;
    background: #111;
    color: white;
    z-index: 99999;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 22px;
}

#book-wrapper {
    width: 100vw;
    height: 100dvh;
    background: #1a1a1a;
    position: relative;
    overflow: hidden;
}

#zoom-layer {
    width: 1200px;
    height: 800px;
    transform-origin: 0 0;
    position: absolute;
    will-change: transform;
}

#book {
    width: 1200px;
    height: 800px;
}

.page {
    background: white;
    overflow: hidden;
}

.page img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
}

/* Pulsanti */
button {
    position: fixed;
    z-index: 9999;
    border: none;
    cursor: pointer;
}

/* Zoom */
.zoom-btn {
    bottom: 20px;
    padding: 14px 18px;
    font-size: 20px;
    background: white;
    border-radius: 10px;
}
#zoom-in { right: 140px; }
#zoom-out { right: 80px; }
#reset-zoom { right: 20px; }

/* Fullscreen */
#fullscreen-btn {
    top: 15px;
    left: 15px;
    background: white;
    border-radius: 10px;
    padding: 8px 12px;
}

/* Frecce */
.nav-btn {
    top: 50%;
    transform: translateY(-50%);
    font-size: 42px;
    background: rgba(255,255,255,0.9);
    border-radius: 50%;
    width: 70px;
    height: 70px;
}
#prev { left: 15px; }
#next { right: 15px; }

#zoom-indicator {
    position: fixed;
    top: 15px;
    right: 20px;
    color: white;
    background: rgba(0,0,0,0.6);
    padding: 6px 12px;
    border-radius: 8px;
    z-index: 9999;
}
</style>
</head>

<body>

<div id="rotate-warning">
    Ruota il dispositivo in orizzontale 📱
</div>

<div id="book-wrapper">
    <div id="zoom-layer">
        <div id="book"></div>
    </div>
</div>

<div id="zoom-indicator">100%</div>

<button id="fullscreen-btn">⛶</button>

<button id="zoom-in" class="zoom-btn">➕</button>
<button id="zoom-out" class="zoom-btn">➖</button>
<button id="reset-zoom" class="zoom-btn">⤢</button>

<button id="prev" class="nav-btn">⟨</button>
<button id="next" class="nav-btn">⟩</button>

<audio id="flipSound" src="flip.mp3"></audio>

<script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>

<script>
const BASE_WIDTH = 1200;
const BASE_HEIGHT = 800;

let scale = 1;
let maxScale = window.innerWidth < 900 ? 12 : 8;

let posX = 0;
let posY = 0;
let pageFlip;

const zoomLayer = document.getElementById("zoom-layer");
const wrapper = document.getElementById("book-wrapper");
const zoomIndicator = document.getElementById("zoom-indicator");
const rotateWarning = document.getElementById("rotate-warning");
const flipSound = document.getElementById("flipSound");

const isMobile = window.innerWidth < 900;

/* ================= LANDSCAPE LOCK ================= */

function checkOrientation() {
    if (isMobile && window.innerHeight > window.innerWidth) {
        rotateWarning.style.display = "flex";
    } else {
        rotateWarning.style.display = "none";
    }
}

window.addEventListener("resize", checkOrientation);
window.addEventListener("orientationchange", checkOrientation);
checkOrientation();

/* ================= FULLSCREEN ================= */

function enterFullscreen() {
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
}

document.getElementById("fullscreen-btn").onclick = enterFullscreen;

/* Auto fullscreen mobile */
if (isMobile) {
    setTimeout(() => {
        enterFullscreen();
    }, 500);
}

/* ================= SCALE ================= */

function calculateInitialScale() {
    const scaleX = wrapper.clientWidth / BASE_WIDTH;
    const scaleY = wrapper.clientHeight / BASE_HEIGHT;
    scale = Math.min(scaleX, scaleY);
    centerContent();
}

function centerContent() {
    const scaledWidth = BASE_WIDTH * scale;
    const scaledHeight = BASE_HEIGHT * scale;

    posX = (wrapper.clientWidth - scaledWidth) / 2;
    posY = (wrapper.clientHeight - scaledHeight) / 2;
}

function clampPosition() {
    const scaledWidth = BASE_WIDTH * scale;
    const scaledHeight = BASE_HEIGHT * scale;

    const minX = wrapper.clientWidth - scaledWidth;
    const minY = wrapper.clientHeight - scaledHeight;

    if (scaledWidth > wrapper.clientWidth)
        posX = Math.min(0, Math.max(minX, posX));
    else
        posX = (wrapper.clientWidth - scaledWidth) / 2;

    if (scaledHeight > wrapper.clientHeight)
        posY = Math.min(0, Math.max(minY, posY));
    else
        posY = (wrapper.clientHeight - scaledHeight) / 2;
}

function updateTransform() {
    clampPosition();
    zoomLayer.style.transform =
        `translate(${posX}px, ${posY}px) scale(${scale})`;
    zoomIndicator.innerText = Math.round(scale * 100) + "%";
}

/* ================= ZOOM ================= */

document.getElementById("zoom-in").onclick = () => {
    scale = Math.min(scale + 0.3, maxScale);
    updateTransform();
};

document.getElementById("zoom-out").onclick = () => {
    scale = Math.max(scale - 0.3, 0.05);
    updateTransform();
};

document.getElementById("reset-zoom").onclick = () => {
    calculateInitialScale();
    updateTransform();
};

/* ================= DRAG ================= */

let isDragging = false;
let startX, startY;

wrapper.addEventListener("pointerdown", e => {
    isDragging = true;
    startX = e.clientX - posX;
    startY = e.clientY - posY;
});

wrapper.addEventListener("pointermove", e => {
    if (isDragging) {
        posX = e.clientX - startX;
        posY = e.clientY - startY;
        updateTransform();
    }
});

wrapper.addEventListener("pointerup", () => {
    isDragging = false;
});

/* ================= NAV ================= */

function playFlipFeedback() {
    flipSound.currentTime = 0;
    flipSound.play().catch(() => {});
    if (navigator.vibrate) navigator.vibrate(20);
}

document.getElementById("next").onclick = () => {
    pageFlip.flipNext();
    playFlipFeedback();
};

document.getElementById("prev").onclick = () => {
    pageFlip.flipPrev();
    playFlipFeedback();
};

/* ================= LOAD ================= */

fetch('pages.json')
.then(r => r.json())
.then(pages => {

    const bookDiv = document.getElementById("book");

    pages.forEach(p => {
        const div = document.createElement("div");
        div.className = "page " + p.type;

        const img = document.createElement("img");
        img.src = p.image;

        div.appendChild(img);
        bookDiv.appendChild(div);
    });

    pageFlip = new St.PageFlip(bookDiv, {
        width: 600,
        height: 800,
        size: "fixed",
        showCover: true,
        usePortrait: false,
        mobileScrollSupport: false,
        useMouseEvents: false
    });

    pageFlip.loadFromHTML(document.querySelectorAll('.page'));

    calculateInitialScale();
    updateTransform();
});
</script>

</body>
</html>
