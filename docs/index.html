<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">

      
<meta name="viewport" 
      content="width=device-width, 
               initial-scale=1.0, 
               maximum-scale=1.0,
               viewport-fit=cover">

<title>Flipbook Album</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100dvh;
    background: #2c2c2c;
    font-family: sans-serif;
    overflow: hidden;
}

#rotate-warning {
    display: none;
    position: fixed;
    inset: 0;
    background: #111;
    color: white;
    z-index: 99999;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 22px;
}

#book-wrapper {
    width: 100vw;
    height: 100dvh;
    background: #1a1a1a;
    position: relative;
    overflow: hidden;
    touch-action: none;
}

#zoom-layer {
    width: 1200px;
    height: 800px;
    transform-origin: 0 0;
    position: absolute;
}

#book {
    width: 1200px;
    height: 800px;
}

.page img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
}

button {
    position: fixed;
    z-index: 9999;
    border: none;
    cursor: pointer;
}

/* Pulsanti */
.zoom-btn {
    bottom: 20px;
    padding: 14px 18px;
    font-size: 20px;
    background: white;
    border-radius: 10px;
}
#zoom-in { right: 140px; }
#zoom-out { right: 80px; }
#reset-zoom { right: 20px; }

#fullscreen-btn {
    top: 15px;
    left: 15px;
    background: white;
    border-radius: 10px;
    padding: 8px 12px;
}

.nav-btn {
    top: 50%;
    transform: translateY(-50%);
    font-size: 42px;
    background: rgba(255,255,255,0.9);
    border-radius: 50%;
    width: 70px;
    height: 70px;
}
#prev { left: 15px; }
#next { right: 15px; }

#zoom-indicator {
    position: fixed;
    top: 15px;
    right: 20px;
    color: white;
    background: rgba(0,0,0,0.6);
    padding: 6px 12px;
    border-radius: 8px;
    z-index: 9999;
}
</style>
</head>

<body>

<div id="rotate-warning">
    Ruota il dispositivo in orizzontale 📱
</div>

<div id="book-wrapper">
    <div id="zoom-layer">
        <div id="book"></div>
    </div>
</div>

<div id="zoom-indicator">100%</div>

<button id="fullscreen-btn">⛶</button>

<button id="zoom-in" class="zoom-btn">➕</button>
<button id="zoom-out" class="zoom-btn">➖</button>
<button id="reset-zoom" class="zoom-btn">⤢</button>

<button id="prev" class="nav-btn">⟨</button>
<button id="next" class="nav-btn">⟩</button>

<audio id="flipSound" src="flip.mp3"></audio>

<script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>

<script>
const BASE_WIDTH = 1200;
const BASE_HEIGHT = 800;

let scale = 1;
let maxScale = window.innerWidth < 900 ? 12 : 8;
let posX = 0;
let posY = 0;

let pageFlip;
let initialDistance = null;
let initialScale = 1;
let fullscreenActivated = false;

const zoomLayer = document.getElementById("zoom-layer");
const wrapper = document.getElementById("book-wrapper");
const zoomIndicator = document.getElementById("zoom-indicator");
const flipSound = document.getElementById("flipSound");

const isMobile = window.innerWidth < 900;

/* LANDSCAPE LOCK */
function checkOrientation() {
    if (isMobile && window.innerHeight > window.innerWidth) {
        document.getElementById("rotate-warning").style.display = "flex";
    } else {
        document.getElementById("rotate-warning").style.display = "none";
    }
}
window.addEventListener("resize", checkOrientation);
window.addEventListener("orientationchange", checkOrientation);
checkOrientation();

/* FULLSCREEN */
function enterFullscreen() {
    if (!fullscreenActivated) {
        const el = document.documentElement;
        if (el.requestFullscreen) el.requestFullscreen();
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
        fullscreenActivated = true;
    }
}

wrapper.addEventListener("pointerdown", () => {
    if (isMobile) enterFullscreen();
});

/* SCALE */
function calculateInitialScale() {
    const scaleX = wrapper.clientWidth / BASE_WIDTH;
    const scaleY = wrapper.clientHeight / BASE_HEIGHT;
    scale = Math.min(scaleX, scaleY);
    centerContent();
}

function centerContent() {
    posX = (wrapper.clientWidth - BASE_WIDTH * scale) / 2;
    posY = (wrapper.clientHeight - BASE_HEIGHT * scale) / 2;
}

function clampPosition() {
    const minX = wrapper.clientWidth - BASE_WIDTH * scale;
    const minY = wrapper.clientHeight - BASE_HEIGHT * scale;

    posX = Math.min(0, Math.max(minX, posX));
    posY = Math.min(0, Math.max(minY, posY));
}

function updateTransform() {
    clampPosition();
    zoomLayer.style.transform =
        `translate(${posX}px, ${posY}px) scale(${scale})`;
    zoomIndicator.innerText = Math.round(scale * 100) + "%";
}

/* PINCH ZOOM */
wrapper.addEventListener("pointermove", e => {
    if (e.pointerType === "touch" && e.isPrimary === false) {
        const touches = e.targetTouches || [];
    }
});

wrapper.addEventListener("touchstart", e => {
    if (e.touches.length === 2) {
        initialDistance = getDistance(e.touches[0], e.touches[1]);
        initialScale = scale;
    }
});

wrapper.addEventListener("touchmove", e => {
    if (e.touches.length === 2) {
        const newDistance = getDistance(e.touches[0], e.touches[1]);
        scale = Math.min(maxScale,
                Math.max(0.1, initialScale * (newDistance / initialDistance)));
        updateTransform();
    }
});

function getDistance(p1, p2) {
    return Math.hypot(
        p2.clientX - p1.clientX,
        p2.clientY - p1.clientY
    );
}

/* DOUBLE TAP */
let lastTap = 0;

wrapper.addEventListener("touchend", e => {
    const now = Date.now();
    if (now - lastTap < 300) {
        scale = scale > 1 ? 1 : 2;
        calculateInitialScale();
        updateTransform();
    }
    lastTap = now;
});

/* ZOOM BUTTONS */
document.getElementById("zoom-in").onclick = () => {
    scale = Math.min(scale + 0.3, maxScale);
    updateTransform();
};
document.getElementById("zoom-out").onclick = () => {
    scale = Math.max(scale - 0.3, 0.1);
    updateTransform();
};
document.getElementById("reset-zoom").onclick = () => {
    calculateInitialScale();
    updateTransform();
};

/* NAV */
function playFlipFeedback() {
    flipSound.currentTime = 0;
    flipSound.play().catch(()=>{});
    if (navigator.vibrate) navigator.vibrate(20);
}

document.getElementById("next").onclick = () => {
    pageFlip.flipNext();
    playFlipFeedback();
};
document.getElementById("prev").onclick = () => {
    pageFlip.flipPrev();
    playFlipFeedback();
};

/* LOAD */
fetch('pages.json')
.then(r => r.json())
.then(pages => {

    const bookDiv = document.getElementById("book");

    pages.forEach(p => {
        const div = document.createElement("div");
        div.className = "page";
        const img = document.createElement("img");
        img.src = p.image;
        div.appendChild(img);
        bookDiv.appendChild(div);
    });

    pageFlip = new St.PageFlip(bookDiv, {
        width: 600,
        height: 800,
        size: "fixed",
        showCover: true,
        usePortrait: false,
        mobileScrollSupport: false,
        useMouseEvents: false
    });

    pageFlip.loadFromHTML(document.querySelectorAll('.page'));

    calculateInitialScale();
    updateTransform();
});
</script>

</body>
</html>
