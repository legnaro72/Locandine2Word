<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>Flipbook Album</title>
<style>
body {
    background: #2c2c2c;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
}
#book-wrapper {
    width: 90%;
    max-width: 900px;
    height: 90vh;
    overflow: auto; /* Permette lo scroll quando zoomato */
    touch-action: pinch-zoom pan-x pan-y;
    -webkit-overflow-scrolling: touch; /* Smooth scroll su iOS */
}
#book {
    width: 100%;
    height: 100%;
}
.page {
    background-color: white;
    overflow: hidden;
    position: relative;
}
.cartone {
    box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
}
.page img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    touch-action: none; /* Evita conflitti sui gesti dell'immagine */
    user-select: none;
}
</style>
</head>
<body>

<div id="book-wrapper">
    <div id="book"></div>
</div>

<audio id="flipSound" src="flip.mp3"></audio>

<script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>

<script>
fetch('pages.json')
.then(response => {
    if (!response.ok) throw new Error("File pages.json non trovato!");
    return response.json();
})
.then(pages => {
    const bookDiv = document.getElementById("book");
    
    pages.forEach(p => {
        const div = document.createElement("div");
        div.className = "page " + p.type;
        div.setAttribute("data-density", p.type === "cartone" ? "hard" : "soft");
        
        const img = document.createElement("img");
        img.src = p.image;
        
        div.appendChild(img);
        bookDiv.appendChild(div);
    });

    const pageFlip = new St.PageFlip(
        bookDiv,
        {
            width: 600,
            height: 800,
            size: "stretch",
            minWidth: 315,
            maxWidth: 1000,
            minHeight: 400,
            maxHeight: 1533,
            showCover: true,
            mobileScrollSupport: true // ✅ Abilitato scroll per mobile
        }
    );

    pageFlip.loadFromHTML(document.querySelectorAll('.page'));

    pageFlip.on("flip", () => {
        const audio = document.getElementById("flipSound");
        if(audio) {
            audio.currentTime = 0;
            audio.play().catch(e => console.log("Audio bloccato"));
        }
    });
})
.catch(error => {
    document.getElementById("book").innerHTML = `<h3 style="color: white; text-align: center; margin-top: 50px;">⚠️ Errore:<br><br>${error.message}</h3>`;
    console.error(error);
});
</script>

</body>
</html>
