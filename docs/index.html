<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scegli l'Album - Locandine2Word</title>
    <style>
        body {
            margin: 0;
            background: #121212;
            color: #ffffff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            text-align: center;
            color: #f1f1f1;
        }

        p {
            color: #aaaaaa;
            margin-bottom: 2rem;
            text-align: center;
            font-size: 1.1rem;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            width: 90%;
            max-width: 800px;
        }

        .album-card {
            background: #1e1e1e;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-decoration: none;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid #333;
        }

        .album-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
            border-color: #555;
            background: #252525;
        }

        .icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .album-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .album-desc {
            font-size: 0.95rem;
            color: #888;
        }

        .footer {
            margin-top: 50px;
            color: #555;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>

    <h1>La Tua Libreria Flipbook</h1>
    <p>Gli album vengono visualizzati solo se generati correttamente nel repository</p>

    <div class="grid-container" id="album-grid">
        <!-- Verranno mostrati solo i formati esistenti -->
    </div>

    <div class="footer">
        Generato con Locandine2Word
    </div>

    <script>
        // Lista dei formati potenziali da controllare
        const formats = [
            { id: "2x3", title: "Formato 2x3", desc: "L'album classico verticale (Standard)", icon: "📘" },
            { id: "3x3", title: "Formato 3x3", desc: "Formato espanso per più contenuti", icon: "📗" },
            { id: "3x4", title: "Formato 3x4", desc: "Modello denso a 3 colonne e 4 righe", icon: "📙" }
        ];

        const grid = document.getElementById('album-grid');

        // Funzione per controllare se un album esiste (cercando il suo pages.json)
        // e caricarlo dinamicamente nella grid
        async function checkAndLoadAlbums() {
            let found = 0;
            for (const f of formats) {
                try {
                    // Controlliamo se esiste il file pages.json nella sottocartella albums/ID/
                    const response = await fetch(`albums/${f.id}/pages.json`, { method: 'HEAD' });

                    if (response.ok) {
                        found++;
                        const card = document.createElement('a');
                        card.href = `flipbook/album.html?format=${f.id}`;
                        card.className = 'album-card';
                        card.innerHTML = `
                            <div class="icon">${f.icon}</div>
                            <div class="album-title">${f.title}</div>
                            <div class="album-desc">${f.desc}</div>
                        `;
                        grid.appendChild(card);
                    }
                } catch (e) {
                    console.log(`Album ${f.id} non presente.`);
                }
            }

            if (found === 0) {
                grid.innerHTML = "<p style='grid-column: 1/-1;'>Nessun album generato trovato. <br>Usa l'app per esportare il tuo primo Flipbook su GitHub!</p>";
            }
        }

        checkAndLoadAlbums();
    </script>
</body>

</html>
