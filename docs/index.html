<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>Flipbook Album</title>

<style>
body {
    margin: 0;
    background: #2c2c2c;
    overflow: hidden;
    font-family: sans-serif;
}

/* Wrapper */
#book-wrapper {
    width: 100vw;
    height: 100vh;
    background: #1a1a1a;
    position: relative;
}

/* Viewport scrollabile stabile */
#book-viewport {
    width: 100%;
    height: 100%;
    overflow: scroll; /* sempre visibili */
    touch-action: pan-x pan-y;
}

/* Scrollbar personalizzate */
#book-viewport::-webkit-scrollbar {
    width: 22px;
    height: 22px;
}

#book-viewport::-webkit-scrollbar-track {
    background: rgba(255,255,255,0.08);
}

#book-viewport::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.5);
    border-radius: 12px;
    border: 4px solid rgba(0,0,0,0.3);
}

#book-viewport::-webkit-scrollbar-thumb:hover {
    background: rgba(255,255,255,0.8);
}

/* Firefox */
#book-viewport {
    scrollbar-width: auto;
    scrollbar-color: rgba(255,255,255,0.6) rgba(255,255,255,0.1);
}

/* Layer zoom reale */
#zoom-layer {
    position: relative;
}

/* Book dimensione base (2 pagine) */
#book {
    width: 1200px;
    height: 800px;
}

/* Pagine */
.page {
    background: white;
    overflow: hidden;
}

.cartone {
    box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
}

.page img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
    user-select: none;
}

/* Pulsanti */
.zoom-btn {
    position: fixed;
    bottom: 20px;
    z-index: 9999;
    padding: 16px 20px;
    font-size: 22px;
    background: rgba(255,255,255,0.95);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(0,0,0,0.4);
}

#zoom-in { right: 90px; }
#zoom-out { right: 20px; }

.zoom-btn:active {
    transform: scale(0.95);
}

#zoom-indicator {
    position: fixed;
    top: 15px;
    right: 20px;
    color: white;
    background: rgba(0,0,0,0.6);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 14px;
}
</style>
</head>

<body>

<div id="book-wrapper">
    <div id="book-viewport">
        <div id="zoom-layer">
            <div id="book"></div>
        </div>
    </div>
</div>

<div id="zoom-indicator">100%</div>
<button id="zoom-in" class="zoom-btn">➕</button>
<button id="zoom-out" class="zoom-btn">➖</button>

<audio id="flipSound" src="flip.mp3"></audio>

<script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>

<script>
const BASE_WIDTH = 1200;
const BASE_HEIGHT = 800;

let scale = 1;
let minScale = 1;
const maxScale = 4;
const zoomStep = 0.2;

const zoomLayer = document.getElementById("zoom-layer");
const viewport = document.getElementById("book-viewport");
const zoomIndicator = document.getElementById("zoom-indicator");

/* Calcolo zoom minimo (2 pagine visibili interamente) */
function calculateMinScale() {
    const scaleX = viewport.clientWidth / BASE_WIDTH;
    const scaleY = viewport.clientHeight / BASE_HEIGHT;
    minScale = Math.min(scaleX, scaleY);
    scale = minScale;
    applyZoom();
}

/* Zoom stabile (dimensioni reali aggiornate) */
function applyZoom() {
    const newWidth = BASE_WIDTH * scale;
    const newHeight = BASE_HEIGHT * scale;

    zoomLayer.style.width = newWidth + "px";
    zoomLayer.style.height = newHeight + "px";
    zoomLayer.style.transform = "none"; // niente scale CSS

    zoomIndicator.innerText = Math.round((scale/minScale)*100) + "%";
}

/* Pulsanti */
document.getElementById("zoom-in").addEventListener("click", () => {
    scale = Math.min(scale + zoomStep, maxScale);
    applyZoom();
});

document.getElementById("zoom-out").addEventListener("click", () => {
    scale = Math.max(scale - zoomStep, minScale);
    applyZoom();
});

/* Rotellina mouse */
viewport.addEventListener("wheel", (e) => {
    if (e.ctrlKey) return;
    e.preventDefault();
    const delta = e.deltaY < 0 ? zoomStep : -zoomStep;
    scale = Math.min(Math.max(scale + delta, minScale), maxScale);
    applyZoom();
}, { passive: false });

/* Caricamento pagine */
fetch('pages.json')
.then(r => {
    if (!r.ok) throw new Error("File pages.json non trovato!");
    return r.json();
})
.then(pages => {
    const bookDiv = document.getElementById("book");

    pages.forEach(p => {
        const div = document.createElement("div");
        div.className = "page " + p.type;
        div.setAttribute("data-density", p.type === "cartone" ? "hard" : "soft");

        const img = document.createElement("img");
        img.src = p.image;

        div.appendChild(img);
        bookDiv.appendChild(div);
    });

    const pageFlip = new St.PageFlip(bookDiv, {
        width: 600,
        height: 800,
        size: "fixed",
        showCover: true,
        mobileScrollSupport: false,
        useMouseEvents: true
    });

    pageFlip.loadFromHTML(document.querySelectorAll('.page'));

    pageFlip.on("flip", () => {
        const audio = document.getElementById("flipSound");
        if(audio) {
            audio.currentTime = 0;
            audio.play().catch(() => {});
        }
    });

    calculateMinScale();
})
.catch(err => {
    document.getElementById("book").innerHTML =
    `<h3 style="color:white;text-align:center;margin-top:50px;">
        ⚠️ Errore:<br><br>${err.message}
    </h3>`;
});

/* Responsive */
window.addEventListener("resize", calculateMinScale);

/* Pinch zoom mobile */
let initialDistance = null;

viewport.addEventListener("touchstart", e => {
    if (e.touches.length === 2) {
        initialDistance = getDistance(e.touches);
    }
});

viewport.addEventListener("touchmove", e => {
    if (e.touches.length === 2 && initialDistance) {
        e.preventDefault();
        const newDistance = getDistance(e.touches);
        const delta = (newDistance - initialDistance) / 300;
        scale = Math.min(Math.max(scale + delta, minScale), maxScale);
        applyZoom();
        initialDistance = newDistance;
    }
}, { passive: false });

function getDistance(touches) {
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.sqrt(dx*dx + dy*dy);
}
</script>

</body>
</html>
