<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    
<title>Album Flipbook</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #111;
    touch-action: none;
    height: 100%;
}

#viewer {
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
}

#album-wrapper {
    transform-origin: center center;
    transition: transform 0.1s ease-out;
}

#album {
    display: flex;
    gap: 10px;
}

.page {
    width: 45vw;
    max-width: 500px;
    height: 65vh;
    background: white;
    box-shadow: 0 0 20px rgba(0,0,0,0.6);
    background-size: cover;
    background-position: center;
}

/* Frecce */
.arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 40px;
    color: white;
    background: rgba(0,0,0,0.5);
    border-radius: 50%;
    padding: 10px 15px;
    cursor: pointer;
    user-select: none;
}

#prev { left: 20px; }
#next { right: 20px; }
</style>
</head>
<body>

<div id="viewer">
    <div id="album-wrapper">
        <div id="album">
            <div class="page" id="page-left"></div>
            <div class="page" id="page-right"></div>
        </div>
    </div>

    <div class="arrow" id="prev">&#10094;</div>
    <div class="arrow" id="next">&#10095;</div>
</div>

<script>
/* ------------------ IMMAGINI ------------------ */
const images = [
    "page1.jpg",
    "page2.jpg",
    "page3.jpg",
    "page4.jpg",
    "page5.jpg",
    "page6.jpg"
];

/* ------------------ PAGINAZIONE ------------------ */
let currentIndex = 0;

const leftPage = document.getElementById("page-left");
const rightPage = document.getElementById("page-right");

function renderPages() {
    leftPage.style.backgroundImage = `url(${images[currentIndex]})`;
    rightPage.style.backgroundImage = `url(${images[currentIndex+1] || ""})`;
}

document.getElementById("next").onclick = () => {
    if (currentIndex < images.length - 2) {
        currentIndex += 2;
        renderPages();
    }
};

document.getElementById("prev").onclick = () => {
    if (currentIndex > 0) {
        currentIndex -= 2;
        renderPages();
    }
};

renderPages();

/* ------------------ FULLSCREEN ------------------ */
let fullscreenDone = false;

function enableFullscreen() {
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
}

document.addEventListener("touchstart", () => {
    if (!fullscreenDone) {
        enableFullscreen();
        fullscreenDone = true;
    }
}, { once: true });

/* ------------------ ZOOM ------------------ */
const wrapper = document.getElementById("album-wrapper");

let scale = 1;
let lastScale = 1;
let startDistance = 0;
let translateX = 0;
let translateY = 0;
let lastTap = 0;

function getDistance(touches) {
    return Math.hypot(
        touches[0].clientX - touches[1].clientX,
        touches[0].clientY - touches[1].clientY
    );
}

function updateTransform() {
    wrapper.style.transform =
        `translate(${translateX}px, ${translateY}px) scale(${scale})`;
}

/* PINCH */
wrapper.addEventListener("touchstart", (e) => {
    if (e.touches.length === 2) {
        startDistance = getDistance(e.touches);
    }

    /* DOUBLE TAP */
    const now = Date.now();
    if (now - lastTap < 300) {
        if (scale === 1) {
            scale = 2;

            const rect = wrapper.getBoundingClientRect();
            const touch = e.touches[0];

            translateX = (window.innerWidth / 2 - touch.clientX) * (scale - 1);
            translateY = (window.innerHeight / 2 - touch.clientY) * (scale - 1);
        } else {
            scale = 1;
            translateX = 0;
            translateY = 0;
        }
        updateTransform();
    }
    lastTap = now;

}, { passive: false });

wrapper.addEventListener("touchmove", (e) => {
    if (e.touches.length === 2) {
        e.preventDefault();
        const newDistance = getDistance(e.touches);
        scale = lastScale * (newDistance / startDistance);
        if (scale < 1) scale = 1;
        updateTransform();
    }
}, { passive: false });

wrapper.addEventListener("touchend", (e) => {
    if (e.touches.length < 2) {
        lastScale = scale;

        if (scale === 1) {
            translateX = 0;
            translateY = 0;
        }
        updateTransform();
    }
});
</script>

</body>
</html>
