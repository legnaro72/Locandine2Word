<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Flipbook Album</title>
<style>
body {
    background: #2c2c2c;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    overflow: hidden;
}
#book {
    width: 90%;
    max-width: 900px;
}
.page {
    background-color: white;
    overflow: hidden;
}
.cartone {
    box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
}
</style>
</head>
<body>

<div id="book"></div>

<audio id="flipSound" src="flip.mp3"></audio>

<script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>

<script>
fetch('pages.json')
.then(response => {
    if (!response.ok) throw new Error("File pages.json non trovato!");
    return response.json();
})
.then(pages => {
    const bookDiv = document.getElementById("book");
    
    pages.forEach(p => {
        const div = document.createElement("div");
        div.className = "page " + p.type;
        div.setAttribute("data-density", p.type === "cartone" ? "hard" : "soft");
        
        // LA SOLUZIONE: Usiamo un tag immagine vero e proprio!
        const img = document.createElement("img");
        img.src = p.image;
        img.style.width = "100%";
        img.style.height = "100%";
        // "contain" assicura che la locandina non venga tagliata ai bordi
        img.style.objectFit = "contain"; 
        
        div.appendChild(img);
        bookDiv.appendChild(div);
    });

    const pageFlip = new St.PageFlip(
        bookDiv,
        {
            width: 600,
            height: 800,
            size: "stretch",
            minWidth: 315,
            maxWidth: 1000,
            minHeight: 400,
            maxHeight: 1533,
            showCover: true,
            mobileScrollSupport: false
        }
    );

    pageFlip.loadFromHTML(document.querySelectorAll('.page'));

    pageFlip.on("flip", () => {
        const audio = document.getElementById("flipSound");
        if(audio) {
            audio.currentTime = 0;
            audio.play().catch(e => console.log("Audio bloccato"));
        }
    });
})
.catch(error => {
    document.getElementById("book").innerHTML = `<h3 style="color: white; text-align: center; margin-top: 50px;">⚠️ Errore:<br><br>${error.message}</h3>`;
    console.error(error);
});
</script>

</body>
</html>
