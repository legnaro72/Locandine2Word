<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Flipbook Album</title>
<style>
body {
    background: #2c2c2c;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    overflow: hidden;
}
#book {
    width: 90%;
    max-width: 900px;
}
.page {
    background-size: cover;
    background-position: center;
    background-color: white;
}
.cartone {
    box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
}
</style>
</head>
<body>

<div id="book"></div>

<audio id="flipSound" src="flip.mp3"></audio>

<script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>
<script>
fetch('pages.json')
.then(response => {
    if (!response.ok) throw new Error("Errore nel caricamento del JSON");
    return response.json();
})
.then(pages => {
    const pageFlip = new St.PageFlip(
        document.getElementById("book"),
        {
            width: 600,
            height: 800,
            size: "stretch",
            minWidth: 315,
            maxWidth: 1000,
            minHeight: 400,
            maxHeight: 1533,
            showCover: true,
            mobileScrollSupport: false
        }
    );

    const pageElements = pages.map(p => {
        const div = document.createElement("div");
        div.className = "page " + p.type;
        div.style.backgroundImage = `url(${p.image})`;
        return div;
    });

    pageFlip.loadFromHTML(pageElements);

    pageFlip.on("flip", () => {
        const audio = document.getElementById("flipSound");
        audio.currentTime = 0;
        audio.play().catch(e => console.log("Audio aut-play bloccato dal browser"));
    });
})
.catch(error => {
    // Questo messaggio apparirà solo se apri il file in locale o ci sono errori di rete
    document.getElementById("book").innerHTML = `<h3 style="color: white; text-align: center; font-family: sans-serif; margin: 40px;">⚠️ Errore di caricamento.<br><br>Se stai aprendo questo file con un doppio clic dal tuo PC, il browser sta bloccando le immagini per sicurezza.<br><br>Devi caricare la cartella su GitHub Pages per vederlo funzionare!</h3>`;
    console.error(error);
});
</script>

</body>
</html>
