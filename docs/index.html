<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<title>Flip Album</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #111;
    overflow: hidden;
}

#viewer {
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow: hidden;
}

#album-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    transform-origin: center center;
}

#album {
    display: flex;
    gap: 10px;
}

.page {
    width: 42vw;
    height: 60vh;
    max-width: 500px;
    background: #fff;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    box-shadow: 0 0 20px rgba(0,0,0,0.6);
}

/* Frecce */
.arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 40px;
    color: white;
    background: rgba(0,0,0,0.4);
    padding: 10px 16px;
    border-radius: 50%;
    user-select: none;
    cursor: pointer;
}

#prev { left: 20px; }
#next { right: 20px; }
</style>
</head>
<body>

<div id="viewer">
    <div id="album-wrapper">
        <div id="album">
            <div class="page" id="page-left"></div>
            <div class="page" id="page-right"></div>
        </div>
    </div>

    <div id="prev" class="arrow">&#10094;</div>
    <div id="next" class="arrow">&#10095;</div>
</div>

<script>
/* ---------- IMMAGINI ---------- */
const images = [
    "page1.jpg",
    "page2.jpg",
    "page3.jpg",
    "page4.jpg"
];

let index = 0;

const left = document.getElementById("page-left");
const right = document.getElementById("page-right");

function render() {
    left.style.backgroundImage = `url(${images[index]})`;
    right.style.backgroundImage = `url(${images[index+1] || ""})`;
}
render();

/* ---------- FRECCE ---------- */
document.getElementById("next").onclick = () => {
    if (index < images.length - 2) {
        index += 2;
        render();
    }
};

document.getElementById("prev").onclick = () => {
    if (index > 0) {
        index -= 2;
        render();
    }
};

/* ---------- FULLSCREEN ---------- */
let fsDone = false;

function enableFullscreen() {
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
}

document.addEventListener("touchstart", () => {
    if (!fsDone) {
        enableFullscreen();
        fsDone = true;
    }
}, { once: true });

/* ---------- ZOOM STABILE ---------- */
const wrapper = document.getElementById("album-wrapper");

let scale = 1;
let lastScale = 1;
let startDist = 0;
let lastTap = 0;

function getDistance(touches) {
    return Math.hypot(
        touches[0].clientX - touches[1].clientX,
        touches[0].clientY - touches[1].clientY
    );
}

function update() {
    wrapper.style.transform = `scale(${scale})`;
}

/* PINCH */
wrapper.addEventListener("touchstart", e => {
    if (e.touches.length === 2) {
        startDist = getDistance(e.touches);
    }

    /* DOUBLE TAP */
    const now = Date.now();
    if (now - lastTap < 300) {
        if (scale === 1) {
            scale = 2;
        } else {
            scale = 1;
        }
        lastScale = scale;
        update();
    }
    lastTap = now;

}, { passive: true });

wrapper.addEventListener("touchmove", e => {
    if (e.touches.length === 2) {
        const newDist = getDistance(e.touches);
        scale = lastScale * (newDist / startDist);
        if (scale < 1) scale = 1;
        update();
    }
}, { passive: true });

wrapper.addEventListener("touchend", e => {
    lastScale = scale;

    if (scale === 1) {
        wrapper.style.transform = "scale(1)";
    }
});
</script>

</body>
</html>
