<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>Flipbook Album</title>

<style>
body {
    background: #2c2c2c;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    overflow: hidden;
}

/* Contenitore esterno */
#book-wrapper {
    width: 95%;
    max-width: 1000px;
    height: 95vh;
    position: relative;
    background: #1a1a1a;
    border-radius: 10px;
    overflow: hidden;
}

/* Contenitore scrollabile */
#book-container {
    width: 100%;
    height: 100%;
    overflow: auto; /* Barre di scorrimento attive */
    position: relative;
}

/* Contenuto scalabile */
#book {
    width: 100%;
    height: 100%;
    transform-origin: top left;
}

/* Pagine */
.page {
    background-color: white;
    overflow: hidden;
    position: relative;
}

.cartone {
    box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
}

.page img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    user-select: none;
    pointer-events: none;
}

/* Pulsanti zoom */
.zoom-btn {
    position: fixed;
    bottom: 20px;
    font-size: 24px;
    z-index: 9999;
    padding: 12px 16px;
    background: rgba(255,255,255,0.9);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.4);
}

#zoom-in {
    right: 80px;
}

#zoom-out {
    right: 20px;
}

.zoom-btn:hover {
    background: white;
}
</style>
</head>

<body>

<div id="book-wrapper">
    <div id="book-container">
        <div id="book"></div>
    </div>
</div>

<button id="zoom-in" class="zoom-btn">➕</button>
<button id="zoom-out" class="zoom-btn">➖</button>

<audio id="flipSound" src="flip.mp3"></audio>

<script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>

<script>
fetch('pages.json')
.then(response => {
    if (!response.ok) throw new Error("File pages.json non trovato!");
    return response.json();
})
.then(pages => {
    const bookDiv = document.getElementById("book");

    pages.forEach(p => {
        const div = document.createElement("div");
        div.className = "page " + p.type;
        div.setAttribute("data-density", p.type === "cartone" ? "hard" : "soft");

        const img = document.createElement("img");
        img.src = p.image;

        div.appendChild(img);
        bookDiv.appendChild(div);
    });

    const pageFlip = new St.PageFlip(
        bookDiv,
        {
            width: 600,
            height: 800,
            size: "stretch",
            minWidth: 315,
            maxWidth: 1200,
            minHeight: 400,
            maxHeight: 1600,
            showCover: true,
            mobileScrollSupport: true
        }
    );

    pageFlip.loadFromHTML(document.querySelectorAll('.page'));

    pageFlip.on("flip", () => {
        const audio = document.getElementById("flipSound");
        if(audio) {
            audio.currentTime = 0;
            audio.play().catch(e => console.log("Audio bloccato"));
        }
    });
})
.catch(error => {
    document.getElementById("book").innerHTML =
    `<h3 style="color: white; text-align: center; margin-top: 50px;">
        ⚠️ Errore:<br><br>${error.message}
    </h3>`;
    console.error(error);
});


// --- SCRIPT ZOOM CORRETTO ---
let scale = 1;
const zoomStep = 0.2;
const minScale = 1;
const maxScale = 3;

const book = document.getElementById("book");
const container = document.getElementById("book-container");

document.getElementById("zoom-in").addEventListener("click", () => {
    scale = Math.min(scale + zoomStep, maxScale);
    applyZoom();
});

document.getElementById("zoom-out").addEventListener("click", () => {
    scale = Math.max(scale - zoomStep, minScale);
    applyZoom();
});

function applyZoom() {
    book.style.transform = `scale(${scale})`;

    /* Ridimensiona virtualmente il contenuto per attivare scroll */
    book.style.width = `${100 * scale}%`;
    book.style.height = `${100 * scale}%`;
}
</script>

</body>
</html>
